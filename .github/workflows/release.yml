# Releases the StoreEnv CLI from this public repository, so the published
# source is the source of the binaries and of the npm package.
#
#   git tag cli-v0.2.0 && git push origin cli-v0.2.0
#
# Every release:
#   1. builds the 5 standalone binaries and runs the CLI suite on the Linux
#      binary and on the npm bundle;
#   2. waits for approval in the "release" environment (required reviewer);
#   3. attests build provenance for every archive (public Sigstore, Rekor)
#      and verifies each attestation;
#   4. publishes to npm with provenance by trusted publishing (no npm token);
#   5. updates the Homebrew formula and publishes the binaries as a release
#      of the tap repository, where install.sh, install.ps1 and the formula
#      download them (owner decision R7 may move them here later).
# A failure at any step stops everything after it.
#
# Setup by the owner: protect cli-v* tags; create the "release" environment
# with the owner as required reviewer; on npmjs.com add this repository,
# workflow release.yml and environment release as trusted publisher of
# storeenv-cli; add HOMEBREW_TAP_TOKEN (fine grained, Contents read and
# write on the tap repository only) to the release environment.
# Users verify a downloaded archive, wherever it came from, with:
#   gh attestation verify storeenv-<target>.tar.gz --repo <this repository>

name: CLI release

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

env:
  TAP_REPO: nodviking/homebrew-storeenv

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches cli/package.json
        shell: bash
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          [ "${GITHUB_REF_NAME#cli-v}" = "$version" ] || { echo "Tag $GITHUB_REF_NAME does not match cli/package.json $version"; exit 1; }
      - run: node cli/scripts/build-binary.js --archive
      - uses: actions/upload-artifact@v4
        with:
          name: storeenv-${{ matrix.target }}
          path: |
            cli/bin/storeenv-*.tar.gz
            cli/bin/storeenv-*.zip
            cli/bin/storeenv-*.sha256
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: storeenv-linux-x64
          path: artifact
      - run: tar -xzf artifact/storeenv-linux-x64.tar.gz -C artifact
      # Core and its protocol vectors, then offline checks of the released
      # binary and of the npm bundle. The CLI's integration suite needs the
      # StoreEnv API and runs on the private commit before each export.
      - run: npm test --workspace packages/core
      - run: node cli/scripts/smoke.js artifact/storeenv
      - run: npm run build --workspace cli
      - run: node cli/scripts/smoke.js cli/dist/index.js

  publish:
    needs: [build, test]
    runs-on: ubuntu-24.04
    # A person approves this job before anything is attested or staged.
    environment: release
    permissions:
      contents: read
      id-token: write # attestations and npm trusted publishing
      attestations: write
    outputs:
      version: ${{ steps.stage.outputs.version }}
      stage-id: ${{ steps.stage.outputs.stage-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # No registry-url: it writes an .npmrc with an _authToken line and a
          # placeholder NODE_AUTH_TOKEN. Trusted publishing uses OIDC only.
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/storeenv-*.tar.gz
            dist/storeenv-*.zip
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          for file in dist/storeenv-*.tar.gz dist/storeenv-*.zip; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            count=$((count + 1))
          done
          [ "$count" -eq 5 ] || { echo "Expected 5 archives, found $count"; exit 1; }
      # Staged publishing needs npm 11.15.0 or later, and trusted publishing
      # must not meet a token: fail if any token variable or _authToken line
      # is in reach, and print the effective configuration (npm redacts
      # secrets).
      - name: Check npm for staged trusted publishing
        run: |
          set -euo pipefail
          version="$(npm -v)"
          echo "npm $version"
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error("npm 11.15.0 or later is needed for staged publishing"); process.exit(1); }' "$version"
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then echo "A token variable reaches the publish step"; exit 1; fi
          for file in "$(npm config get userconfig)" "$(npm config get globalconfig)" .npmrc cli/.npmrc; do
            if [ -f "$file" ] && grep -q "_authToken" "$file"; then echo "_authToken found in $file"; exit 1; fi
          done
          npm config list
      # npm reads the bin path before prepublishOnly builds the bundle. Build
      # first, then fail on any bin warning from a dry run, so a package
      # without its storeenv command can't be staged.
      - name: Build the npm package and check its command
        working-directory: cli
        run: |
          npm run build
          npm publish --dry-run 2> publish-check.log || { cat publish-check.log; exit 1; }
          if grep -qiE "No bin file|invalid and removed" publish-check.log; then cat publish-check.log; exit 1; fi
          rm publish-check.log
      # The version goes to npm staged, not public: a maintainer approves it
      # with two factor authentication (npm stage approve <id>). --provenance
      # makes npm fail instead of staging without provenance. The bundle was
      # built and checked in the step before, so lifecycle scripts are
      # skipped and stdout holds only npm's JSON (in 0.2.2 their output
      # broke reading the id); scripts/stage-id.js reads it either way.
      - name: Stage on npm with provenance
        id: stage
        working-directory: cli
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npm stage publish --provenance --access public --json --ignore-scripts > stage.json
          cat stage.json
          id="$(node scripts/stage-id.js stage.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stage-id=$id" >> "$GITHUB_OUTPUT"
          {
            echo "### storeenv-cli@$version is staged on npm"
            echo
            echo "Stage id: \`$id\`"
            echo
            echo "1. Approve it on npm (needs two factor authentication): \`npm stage approve $id\`"
            echo "2. Then approve the distribute job, which waits until $version is live on npm before Homebrew and the binaries."
          } >> "$GITHUB_STEP_SUMMARY"

  distribute:
    needs: publish
    runs-on: ubuntu-24.04
    # A person approves this job only after approving the npm stage. Its
    # first step checks that the version is live on npm, with provenance,
    # and stops before Homebrew and the binaries otherwise.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Wait until the npm version is live with provenance
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          STAGE_ID: ${{ needs.publish.outputs.stage-id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            live="$(npm view "storeenv-cli@$VERSION" version 2>/dev/null || true)"
            if [ "$live" = "$VERSION" ]; then
              url="$(npm view "storeenv-cli@$VERSION" dist.attestations.url 2>/dev/null || true)"
              [ -n "$url" ] || { echo "storeenv-cli@$VERSION is live without provenance"; exit 1; }
              echo "storeenv-cli@$VERSION is live; provenance: $url"
              exit 0
            fi
            sleep 30
          done
          echo "storeenv-cli@$VERSION is not live on npm yet. Approve stage $STAGE_ID (npm stage approve $STAGE_ID), then re-run this job."
          exit 1
      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.publish.outputs.version }}"
          node cli/scripts/homebrew-formula.js "$version" dist > storeenv.rb
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          git config user.name "nodviking"
          git config user.email "166697996+nodviking@users.noreply.github.com"
          mkdir -p Formula && cp ../storeenv.rb Formula/storeenv.rb
          git add Formula/storeenv.rb
          if git diff --cached --quiet; then echo "Formula already up to date"; else git commit -m "storeenv $version" && git push origin HEAD; fi
      - name: Publish the binaries
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.publish.outputs.version }}"
          cat dist/*.sha256 > dist/checksums.txt
          gh release create "v$version" --repo "$TAP_REPO" --target main --title "StoreEnv CLI $version" \
            --notes "Built from $GITHUB_REPOSITORY@$GITHUB_SHA. Verify: gh attestation verify <archive> --repo $GITHUB_REPOSITORY" \
            dist/*.tar.gz dist/*.zip dist/*.sha256 dist/checksums.txt
